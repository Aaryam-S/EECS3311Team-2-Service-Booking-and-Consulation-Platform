server.port=${PORT:${BACKEND_PORT:8080}}
spring.application.name=service-booking-platform
llm.api.key=${LLM_API_KEY:}

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Run schema.sql on startup (CREATE TABLE IF NOT EXISTS - safe to re-run)
spring.sql.init.mode=always
spring.sql.init.platform=postgres
spring.jpa.hibernate.ddl-auto=none
